[project]
name = "radar-core"
version = "0.1.0"
description = "Radar de Desatención — registro de eventos de entrega humanitaria con salida pública"
authors = [{ name = "Radar de Desatención" }]
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi (>=0.115)",
    "uvicorn[standard] (>=0.32)",
    "sqlalchemy (>=2.0)",
    "psycopg[binary] (>=3.2)",
    "geoalchemy2 (>=0.16)",
    "pydantic (>=2.9)",
    "pydantic-settings (>=2.6)",
    "rapidfuzz (>=3.10)",
    "httpx (>=0.27)",
    "fpdf2 (>=2.8)",
    "qrcode[pil] (>=8.0)",
    "cryptography (>=43.0)",
    "jinja2 (>=3.1)",
    "pyshp (>=3.1.6,<4.0.0)",
]

[tool.poetry]
packages = [{ include = "radar_core" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3"
pytest-timeout = ">=2.3"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: pruebas unitarias (U)",
    "integration: pruebas de integración (I)",
    "service: pruebas de servicio/contrato (S)",
    "performance: pruebas de performance (P)",
    "transversal: seguridad y privacidad (X)",
    "e2e: punta a punta del sistema completo (E/S-4x)",
    "epica01: Radar de Atención (core)",
    "epica02: Radar Ciudadano (componentes 9-11)",
    "epica03: Radar Operativo (componentes 12-14)",
]
timeout = 600

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
