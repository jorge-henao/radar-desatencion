vigia:
  activo: true
  cadencia_horas: 24
  caducidad_dias: 10
  # El proveedor LLM, modelo y API keys NO viven en YAML.
  # Configurar por entorno:
  # RADAR_VIGIA_LLM_PROVIDER=openai|anthropic
  # RADAR_VIGIA_LLM_MODEL=<modelo>
  # RADAR_OPENAI_API_KEY=... o RADAR_ANTHROPIC_API_KEY=...
  terminos_busqueda:
    - "ayuda humanitaria {departamento}"
    - "damnificados sin ayuda"
  fuentes:
    - id: eltiempo
      url: https://www.eltiempo.com/colombia
      tipo: medio
      confianza: 0.8
      activa: true
    - id: cuidar_colombia
      url: https://cuidarcolombia.vercel.app
      tipo: agregador_verificado
      confianza: 0.85
      activa: true
vista_operativa:
  modo: curado
